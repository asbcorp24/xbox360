name: Build Xbox 360 Homebrew

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest
    env:
      DEVKITXENON: /usr/local/xenon
      PATH: /usr/local/xenon/bin:/usr/local/xenon/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain info
        run: |
          echo "DEVKITXENON=$DEVKITXENON"
          which xenon-gcc || true
          xenon-gcc --version || true
          make --version

      - name: Install generator runtime
        run: |
          apt-get update
          apt-get install -y python3

      - name: Generate game data and assets
        run: |
          python3 tools/xgm.py validate
          python3 tools/xgm.py generate

      - name: Build
        run: |
          make clean || true
          make

      - name: Verify outputs
        run: |
          test -f xbox360-pixel.elf
          test -f xbox360-pixel.elf32
          ls -lh xbox360-pixel.elf xbox360-pixel.elf32

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xbox360-pixel-build
          path: |
            xbox360-pixel.elf
            xbox360-pixel.elf32
          if-no-files-found: error
          retention-days: 30

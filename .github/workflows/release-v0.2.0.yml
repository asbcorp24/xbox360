name: First Release v0.2.0

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release v0.2.0'
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest
    env:
      DEVKITXENON: /usr/local/xenon
      PATH: /usr/local/xenon/bin:/usr/local/xenon/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install generator runtime
        run: |
          apt-get update
          apt-get install -y python3

      - name: Validate and generate project
        run: |
          python3 tools/xgm.py validate
          python3 tools/xgm.py generate

      - name: Build
        run: make

      - name: Verify outputs
        run: |
          test -f xbox360-pixel.elf
          test -f xbox360-pixel.elf32
          ls -lh xbox360-pixel.elf xbox360-pixel.elf32

      - name: Create v0.2.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          target_commitish: main
          name: Xbox360 Game Maker v0.2.0
          body: |
            Console-first Xbox360 Game Maker prototype.

            New in v0.2.0:
            - CLI project editor
            - PNG sprite-sheet pipeline
            - idle/walk/jump player animation
            - sprite flipping
            - three connected level screens
            - persistent collectibles between screens
            - jump and collect sound through libxenon
            - optional custom WAV sound support
            - automatic project generation in CI

            Controls:
            - Left stick / D-pad: move
            - A: jump
            - Start: restart
          files: |
            xbox360-pixel.elf
            xbox360-pixel.elf32

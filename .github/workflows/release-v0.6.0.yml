name: First Release v0.6.0

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release v0.6.0'
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest
    env:
      DEVKITXENON: /usr/local/xenon
      PATH: /usr/local/xenon/bin:/usr/local/xenon/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install generator runtime
        run: |
          apt-get update
          apt-get install -y python3

      - name: Validate and generate project
        run: |
          python3 tools/xgm.py validate
          python3 tools/xgm.py generate

      - name: Build
        run: make

      - name: Verify outputs
        run: |
          test -f xbox360-pixel.elf
          test -f xbox360-pixel.elf32
          ls -lh xbox360-pixel.elf xbox360-pixel.elf32

      - name: Create v0.6.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0
          target_commitish: main
          name: Xbox360 Game Maker v0.6.0
          body: |
            Visual pipeline release.

            New in v0.6.0:
            - Camera2D horizontal follow
            - configurable dead zone and smoothing
            - per-room world width
            - PNG backgrounds
            - multiple parallax layers
            - foreground layers
            - repeat X/Y support
            - independent parallax speeds
            - screen shake on damage and melee attacks
            - screen-fixed HUD
            - visual assets compiled to generated_visuals.h
            - console commands: set-camera, set-background, add-parallax, add-foreground
            - demo sky, far city, near city and foreground PNG layers
          files: |
            xbox360-pixel.elf
            xbox360-pixel.elf32

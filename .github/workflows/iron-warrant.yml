name: Build Iron Warrant

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest
    env:
      DEVKITXENON: /usr/local/xenon
      PATH: /usr/local/xenon/bin:/usr/local/xenon/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: |
          apt-get update
          apt-get install -y python3
      - name: Check tools
        run: python3 -m py_compile tools/xgm.py tools/scriptgen.py tools/rpggen.py tools/visualgen.py tools/simulator.py
      - name: Validate Iron Warrant
        run: python3 tools/xgm.py --project games/iron_warrant validate
      - name: Generate Iron Warrant
        run: python3 tools/xgm.py --project games/iron_warrant generate
      - name: Build Xbox 360
        run: |
          make clean || true
          make
      - name: Verify
        run: |
          test -f xbox360-pixel.elf
          test -f xbox360-pixel.elf32
          ls -lh xbox360-pixel.elf xbox360-pixel.elf32
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: iron-warrant-xbox360
          path: |
            xbox360-pixel.elf
            xbox360-pixel.elf32
          if-no-files-found: error
          retention-days: 30

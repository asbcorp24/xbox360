name: First Release v0.1.0

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release v0.1.0'
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest
    env:
      DEVKITXENON: /usr/local/xenon
      PATH: /usr/local/xenon/bin:/usr/local/xenon/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Verify outputs
        run: |
          test -f xbox360-pixel.elf
          test -f xbox360-pixel.elf32
          ls -lh xbox360-pixel.elf xbox360-pixel.elf32

      - name: Create v0.1.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: main
          name: Pixel Run 360 v0.1.0
          body: |
            First playable Xbox 360 homebrew prototype.

            Controls:
            - Left stick / D-pad: move
            - A: jump
            - Start: restart

            Goal: collect all five crystals and reach the exit.
          files: |
            xbox360-pixel.elf
            xbox360-pixel.elf32

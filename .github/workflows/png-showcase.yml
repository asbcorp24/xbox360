name: Build PNG Showcase Demo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  showcase:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest
    env:
      DEVKITXENON: /usr/local/xenon
      PATH: /usr/local/xenon/bin:/usr/local/xenon/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        run: |
          apt-get update
          apt-get install -y python3

      - name: Check Python tools
        run: |
          python3 -m py_compile tools/simulator.py tools/xgm.py tools/scriptgen.py tools/rpggen.py tools/visualgen.py

      - name: Validate PNG showcase
        run: python3 tools/xgm.py --project demos/png_showcase/game.json validate

      - name: Generate PNG showcase
        run: python3 tools/xgm.py --project demos/png_showcase/game.json generate

      - name: Build Xbox 360 showcase
        run: |
          make clean || true
          make

      - name: Verify outputs
        run: |
          test -f xbox360-pixel.elf
          test -f xbox360-pixel.elf32
          ls -lh xbox360-pixel.elf xbox360-pixel.elf32

      - name: Upload PNG showcase binaries
        uses: actions/upload-artifact@v4
        with:
          name: xgm-png-showcase
          path: |
            xbox360-pixel.elf
            xbox360-pixel.elf32
          if-no-files-found: error
          retention-days: 30
